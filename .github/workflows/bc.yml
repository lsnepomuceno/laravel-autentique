# Backward compatibility, checked against the last release rather than against
# review.
#
# The package is a library: its public surface is other people's code, and the
# value objects are part of it (docs/spec/public-api.md). A break found by
# reading the diff is found by the method that eventually misses one.
#
# It compares the last SemVer tag against HEAD, so the baseline moves on its own
# as releases are cut and there is no list to maintain.
#
# **Dormant until the first release.** With no tag there is nothing to compare
# against, and the checker fails rather than reporting nothing. The first step
# looks for a tag and every later step is skipped without one, so the job is
# green and says why in its summary.
#
# **It reports, it does not block**, as in laravel-a1-pdf-sign: whether a break
# is acceptable is a judgement, and a gate that fails on every deliberate one is
# turned off within two releases. What it found goes into the job summary.
#
# **The tool is installed in a directory of its own, not into require-dev**: it
# needs ext-intl and a dependency tree that would have to coexist with Pest 5,
# and composer-dependency-analyser would report a binary nothing imports.
#
# **Not the nyholm/roave-bc-check image.** It is pinned to an older parser and
# fails on PHP 8.4's `new Foo()->bar()`, measured in laravel-a1-pdf-sign on
# 2026-08-09.
name: BC

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bc-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  roave:
    name: Backward compatibility
    runs-on: ubuntu-latest

    steps:
      # The tool resolves its own baseline from the tags, so a shallow clone
      # leaves it with nothing to compare against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the last release
        id: baseline
        run: |
          tag=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Nothing released yet
        if: steps.baseline.outputs.tag == ''
        run: |
          {
            echo "## Backward compatibility"
            echo
            echo "No release to compare against yet. This check starts with the first tag."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install PHP
        if: steps.baseline.outputs.tag != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # intl is the tool's requirement, not the package's.
          extensions: intl, zip, mbstring, fileinfo
          coverage: none

      - name: Install the checker
        if: steps.baseline.outputs.tag != ''
        run: |
          mkdir -p "${RUNNER_TEMP}/bc"
          composer require --no-interaction --no-progress \
            --working-dir="${RUNNER_TEMP}/bc" \
            roave/backward-compatibility-check:^8.21

      # Deliberately not blocking, see the note at the top of this file.
      - name: Check for BC breaks
        if: steps.baseline.outputs.tag != ''
        id: bc
        continue-on-error: true
        run: |
          set +e
          "${RUNNER_TEMP}/bc/vendor/bin/roave-backward-compatibility-check" \
            --from="${{ steps.baseline.outputs.tag }}" \
            | tee "${RUNNER_TEMP}/bc-report.txt"
          echo "status=${PIPESTATUS[0]}" >> "${GITHUB_OUTPUT}"

      # Passing quietly is what turns a report into noise nobody reads, so what
      # it found goes where the pull request shows it.
      - name: Publish what it found
        if: steps.baseline.outputs.tag != ''
        run: |
          {
            echo "## Backward compatibility against ${{ steps.baseline.outputs.tag }}"
            echo
            if [ "${{ steps.bc.outputs.status }}" = "0" ]; then
              echo "No backwards-incompatible changes against the last release."
            else
              echo "**Breaks detected.** Answer them in the changelog, in the release"
              echo "notes and in the version number. This job does not block the merge."
              echo
              echo '```'
              grep -E '^\[BC\]|backwards-incompatible' "${RUNNER_TEMP}/bc-report.txt" || true
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
