# Autentique API v2, Corporate endpoint (/v2/graphql/corporate).
#
# ASSEMBLED, NOT INTROSPECTED: the endpoint answers `no_enterprise_access` to an
# account without the Corporate plan, and none was available. Where the
# standard schema, introspected, shares a type with this one, it wins: the
# WebhookEventTypeEnum below lists all seventeen events as the standard one does,
# where the Corporate documentation lists fifteen. Built on 2026-09-21 from the Corporate space of
# Autentique's documentation, which shows every operation and most types but
# names few of them. Every type name below that the documentation does not
# give is a guess, and #34 covers replacing this file with an introspection as
# well.
#
# Every operation file in src/Resources/graphql/corporate is validated against
# this file by tests/GraphQL/SchemaTest.php.

scalar CNPJScalar
scalar TimestampScalar
scalar InternationalDateScalar
scalar EmailScalar
scalar CPF
scalar Date

type Query {
  organizations(id: Int, name: String, start_date: String, end_date: String, limit: Int, page: Int): [EnterpriseChildOrganization]
  organizationMembers(
    organization_id: Int!
    id: String
    name: String
    start_date: String
    end_date: String
    limit: Int
    page: Int
  ): [EnterpriseMember]
  organizationsPlans(organizations_ids: [Int]!): [OrganizationPlan]
  childOrganizationsApiUsage(organization_id: Int!, start_date: String!, end_date: String!): ApiUsage
  subscriptionPlans(id: String, limit: Int = 60, page: Int = 1): [CorporatePlan]
}

type Mutation {
  createOrganization(organization: ChildOrganizationInput!): EnterpriseChildOrganization
  updateOrganization(id: Int!, organization: UpdateChildOrganizationInput!): EnterpriseChildOrganization
  updateOrganizationPlan(organization_id: Int!, plan: CustomPlansEnum!, days_until_expiration: Int): EnterpriseChildOrganization
  deleteOrganization(id: Int!): Boolean
  createOrganizationMember(organization_id: Int!, member: OrganizationMemberInput!): EnterpriseMember
  updateOrganizationMember(organization_id: Int!, user_id: String!, member: OrganizationMemberInput!): EnterpriseMember
  deleteOrganizationMember(organization_id: Int!, user_id: String!): Boolean
  createOrganizationMemberLoginCode(organization_id: Int!, user_id: String!): String
  createEndpoint(
    organization_id: Int!
    url: String!
    format: WebhookFormatEnum!
    type: WebhookEndpointTypeEnum!
    name: String!
    events: [WebhookEventTypeEnum!]!
    folder_id: String
  ): CreatedEndpoint
  createSubscriptionPlan(plan: SubscriptionPlanInput!): CorporatePlan
  updateSubscriptionPlan(id: String!, plan: SubscriptionPlanInput!): CorporatePlan
  updateOrganizationSubscription(organization_id: Int!, plan_id: String!, renew_date: InternationalDateScalar): Subscription
}

type EnterpriseChildOrganization {
  id: Int!
  uuid: String
  name: String
  cnpj: CNPJScalar
  plan: PipefyPlansEnum!
  default_email_templates_ids: [Int]
  settings: Setting
  groups: [Group]
  subscription: Subscription
  created_at: TimestampScalar
}

type Setting {
  webhook_url: String
}

type Group {
  id: Int!
  uuid: String
  name: String
}

